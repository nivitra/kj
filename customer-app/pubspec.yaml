name: studio_gallery
description: Photo Studio Customer Gallery App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP & API
  dio: ^5.6.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # UI & Utils
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  photo_view: ^0.14.0
  share_plus: ^10.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  saver_gallery: ^3.0.6
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  crypto: ^3.0.7
  http: ^1.6.0
  web: ^1.1.1
  video_player: ^2.13.0
  chewie: ^1.13.1
  flutter_skill: ^0.9.36

dependency_overrides:
  path_provider_android: 2.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
